name: Deploy Hockey Quiz

on:
  workflow_run:
    workflows: ["Verify Hockey Quiz"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hockey-quiz-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production VPS
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify commit is still the latest main
        id: freshness
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" == "$RELEASE_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Verified commit is no longer latest main; skipping deploy.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.freshness.outputs.current == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: steps.freshness.outputs.current == 'true'
      - run: npm run build
        if: steps.freshness.outputs.current == 'true'
      - name: Deliver and activate release
        if: steps.freshness.outputs.current == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash deploy/deploy-ci.sh
